name: Android APK Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ci/last_build.log'
      - 'ci/last_success_run.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct project
        run: |
          cat ci/source/chunk_*.b64 > saadi-v0.3.zip.b64
          base64 --decode saadi-v0.3.zip.b64 > saadi-v0.3.zip
          unzip -q saadi-v0.3.zip
          test -f saadi-audio-tafsir/settings.gradle.kts

      - name: Apply Arabic audio patch
        run: |
          cp ci/patch/TafsirTts.kt saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/player/TafsirTts.kt
          python3 ci/patch/apply_audio_patch.py

      - name: Prepare Android project
        working-directory: saadi-audio-tafsir
        run: |
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\n' > gradle.properties
          sed -i 's/androidx.room:room-runtime:2.6.1/androidx.room:room-runtime:2.7.2/' app/build.gradle.kts
          sed -i 's/androidx.room:room-ktx:2.6.1/androidx.room:room-ktx:2.7.2/' app/build.gradle.kts
          sed -i 's/androidx.room:room-compiler:2.6.1/androidx.room:room-compiler:2.7.2/' app/build.gradle.kts
          sed -i '/buildFeatures { compose = true }/i\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n' app/build.gradle.kts

      - name: Build debug APK
        working-directory: saadi-audio-tafsir
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Saadi-Tafsir-v0.3.1-APK
          path: saadi-audio-tafsir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record successful run id
        if: success()
        run: |
          mkdir -p ci
          echo "${GITHUB_RUN_ID}" > ci/last_success_run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/last_success_run.txt
          git commit -m 'CI: record successful Android run [skip ci]' || true
          git push || true

      - name: Save build failure log
        if: failure()
        run: |
          mkdir -p ci
          cp build.log ci/last_build.log || echo 'Build failed before Gradle log creation.' > ci/last_build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/last_build.log
          git commit -m 'CI: save Android build failure log [skip ci]' || true
          git push || true

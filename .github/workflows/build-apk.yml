name: Android APK Build v0.3.4
'on':
  push:
    branches: [main]
    paths-ignore: ['ci/last_build.log','ci/last_success_run.txt']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Reconstruct base project
        run: |
          cat ci/source/chunk_*.b64 > saadi-base.zip.b64
          base64 --decode saadi-base.zip.b64 > saadi-base.zip
          unzip -q saadi-base.zip
          test -f saadi-audio-tafsir/settings.gradle.kts
      - name: Apply audio and security upgrade
        run: python3 ci/patch/v033_upgrade.py
      - name: Apply Islamic icons and UI styling
        run: python3 ci/patch/v033_icons.py
      - name: Import complete Quran and Tafsir
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/meibassam/mosahaf-tafseer.git /tmp/mosahaf-tafseer
          cd /tmp/mosahaf-tafseer && git sparse-checkout set json-data && cd "$GITHUB_WORKSPACE"
          rm -rf saadi-audio-tafsir/app/src/main/assets/tafsir
          python3 ci/patch/import_full_saadi.py /tmp/mosahaf-tafseer/json-data saadi-audio-tafsir/app/src/main/assets/tafsir
          test "$(find saadi-audio-tafsir/app/src/main/assets/tafsir -name '*.json' | wc -l)" -eq 114
      - name: Prepare Android project
        working-directory: saadi-audio-tafsir
        run: |
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n' > gradle.properties
          sed -i 's/androidx.room:room-runtime:2.6.1/androidx.room:room-runtime:2.7.2/' app/build.gradle.kts
          sed -i 's/androidx.room:room-ktx:2.6.1/androidx.room:room-ktx:2.7.2/' app/build.gradle.kts
          sed -i 's/androidx.room:room-compiler:2.6.1/androidx.room:room-compiler:2.7.2/' app/build.gradle.kts
          sed -i '/buildFeatures { compose = true }/i\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n' app/build.gradle.kts
      - name: Validate audio icons security and content
        run: |
          test -s saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/player/AudioUrlResolver.kt || { echo 'FAIL AUDIO RESOLVER'; exit 11; }
          test -s saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/player/AudioClient.kt || { echo 'FAIL AUDIO CLIENT'; exit 12; }
          grep -q 'https://' saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/player/AudioUrlResolver.kt || { echo 'FAIL HTTPS AUDIO'; exit 13; }
          grep -q 'fun toggle' saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/player/AudioClient.kt || { echo 'FAIL PLAY PAUSE'; exit 14; }
          grep -q 'fun seekBy' saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/player/AudioClient.kt || { echo 'FAIL SEEK CONTROLS'; exit 15; }
          test -s saadi-audio-tafsir/app/src/main/res/drawable/ic_launcher_saadi.xml || { echo 'FAIL LAUNCHER ICON'; exit 16; }
          test -s saadi-audio-tafsir/app/src/main/res/drawable/ic_islamic_ornament.xml || { echo 'FAIL ISLAMIC ORNAMENT'; exit 17; }
          grep -q 'android:icon="@drawable/ic_launcher_saadi"' saadi-audio-tafsir/app/src/main/AndroidManifest.xml || { echo 'FAIL ICON MANIFEST'; exit 18; }
          grep -q 'usesCleartextTraffic="false"' saadi-audio-tafsir/app/src/main/AndroidManifest.xml || { echo 'FAIL NETWORK SECURITY'; exit 19; }
          test "$(find saadi-audio-tafsir/app/src/main/assets/tafsir -name '*.json' | wc -l)" -eq 114 || { echo 'FAIL COMPLETE TAFSIR'; exit 20; }
          grep -q 'Color(0xFFF4C86A)' saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/ui/SaadiApp.kt || { echo 'FAIL GOLD UI'; exit 21; }
          grep -q 'Color(0xFF1B5A49)' saadi-audio-tafsir/app/src/main/java/com/distritech/saaditafsir/ui/SaadiApp.kt || { echo 'FAIL EMERALD UI'; exit 22; }
          echo 'STATIC VALIDATION PASSED: audio controls + icons + security + 114 surahs + UI palette'
      - name: Build debug APK
        working-directory: saadi-audio-tafsir
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee ../build.log
      - name: Verify APK
        run: |
          test -s saadi-audio-tafsir/app/build/outputs/apk/debug/app-debug.apk
          ls -lh saadi-audio-tafsir/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saadi-Tafsir-v0.3.4-AUDIO-ICONS-UI-APK
          path: saadi-audio-tafsir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Save build failure log
        if: failure()
        run: |
          cp build.log ci/last_build.log || echo 'Build failed before Gradle; inspect named validation step.' > ci/last_build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/last_build.log
          git commit -m 'CI: save v0.3.4 failure [skip ci]' || true
          git push || true
